# .coderabbit.yaml
language: ko-KR # 한국말로 설정
early_access: true
enable_free_tier: true

reviews:
  profile: "chill" # 리뷰 강도 완화(부드러운 피드백 중심)
  request_changes_workflow: true # 리뷰 후 필요한 경우 변경 요청
  high_level_summary: true  # 변경 사항 요약 제공
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
  